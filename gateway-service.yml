spring:
  application:
    name: gateway-service

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

logging:
  level:
    org.springframework.web.cors: DEBUG
    org.springframework.cloud.gateway: DEBUG

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
          lower-case-service-id: true
      routes:
        # Boutique Service
        - id: tache-categories
          uri: lb://tache-service
          predicates:
            - Path=/api/categories/**
        - id: tache-produits
          uri: lb://tache-service
          predicates:
            - Path=/api/tache/**

        # Utilisateur Service
        - id: utilisateur-auth
          uri: lb://utilisateur-service
          predicates:
            - Path=/api/auth/**

