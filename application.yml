# ---- Eureka ----
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

# ---- Logging ----
logging:
  level:
    root: INFO
    org.springframework.cloud.netflix.eureka: DEBUG


# ---- Config Server ----
spring:
  config:
    import: optional:configserver:http://localhost:8888


